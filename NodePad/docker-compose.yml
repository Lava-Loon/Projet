version: "3.9"

services:
  postgres: 
    image: postgres:15
    container_name: notepad_postgres_db
    restart: always
    environment: 
      POSTGRES_USER: Andii
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: nodepad_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: