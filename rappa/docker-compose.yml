services:
  postgres:
    image: postgres:15
    container_name: rappa-postgres
    restart: always
    environment:
      POSTGRES_USER: andii
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: rappa
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data:   
